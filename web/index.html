<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="programa_caja">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>programa_caja</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Fallback si la app no carga (Safari, red lenta, etc.) -->
  <div id="flutter-load-fallback" style="display:none; padding: 2rem; text-align: center; font-family: sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; box-sizing: border-box;">
    <p id="flutter-load-message" style="margin: 1rem 0;">La aplicación no ha cargado correctamente.</p>
    <p style="margin: 0.5rem 0; color: #aaa;">Compruebe la conexión WiFi e intente de nuevo.</p>
    <button id="flutter-retry-btn" type="button" style="margin: 8px; padding: 12px 24px; font-size: 16px; cursor: pointer;">Reintentar</button>
    <button id="flutter-retry-nocache-btn" type="button" style="margin: 8px; padding: 12px 24px; font-size: 16px; cursor: pointer;">Reintentar sin caché</button>
  </div>
  <script>
    (function() {
      var fallback = document.getElementById('flutter-load-fallback');
      var message = document.getElementById('flutter-load-message');
      var retryBtn = document.getElementById('flutter-retry-btn');
      var nocacheBtn = document.getElementById('flutter-retry-nocache-btn');
      function showFallback(msg) {
        if (msg) message.textContent = msg;
        fallback.style.display = 'block';
      }
      function isFlutterReady() {
        return document.querySelector('flt-glass-pane') || document.querySelector('canvas') || (typeof window.__flutter !== 'undefined');
      }

      // Quitar service workers/caché viejos automáticamente (el usuario solo recarga o reabre).
      function clearOldWebCache() {
        var hadSw = false;
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
            hadSw = regs.length > 0;
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          }));
        }
        if (window.caches && caches.keys) {
          tasks.push(caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }));
        }
        return Promise.all(tasks).then(function() {
          return hadSw;
        }).catch(function() { return false; });
      }

      function bootFlutter() {
        var script = document.createElement('script');
        script.async = true;
        var hasNocache = window.location.search.indexOf('nocache=') !== -1;
        script.src = 'flutter_bootstrap.js' + (hasNocache ? '?t=' + Date.now() : '');
        script.onerror = function() { showFallback('Error al cargar la aplicación. Compruebe la conexión.'); };
        script.onload = function() {
          var deadline = Date.now() + 25000;
          function check() {
            if (isFlutterReady()) return;
            if (Date.now() > deadline) {
              showFallback('La aplicación no ha cargado a tiempo. Compruebe la conexión.');
              return;
            }
            setTimeout(check, 500);
          }
          setTimeout(check, 2000);
        };
        document.body.appendChild(script);
      }

      clearOldWebCache().then(function(hadSw) {
        // Si había un service worker antiguo, recargar una sola vez para coger la versión nueva.
        if (hadSw && !sessionStorage.getItem('caja_sw_cleared')) {
          sessionStorage.setItem('caja_sw_cleared', '1');
          location.reload();
          return;
        }
        bootFlutter();
      });

      retryBtn.onclick = function() { location.reload(); };
      nocacheBtn.onclick = function() {
        location.href = location.pathname + '?nocache=' + Date.now() + (location.hash || '');
      };
    })();
  </script>
</body>
</html>
